name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_FILE: ./data/app.db
      SESSION_SECRET: ci-test-secret-must-be-at-least-32-chars-long
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ChangeMe123!
      SEED_DEMO: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test

      - name: DB migrate
        run: bun run db:migrate

      - name: DB seed
        run: bun run db:seed

      - name: Turso file-DB migrate + seed (LibSQL path)
        run: |
          rm -f /tmp/turso-ci.db
          TURSO_DATABASE_URL="file:/tmp/turso-ci.db" bun run db:migrate:turso
          TURSO_DATABASE_URL="file:/tmp/turso-ci.db" SEED_DEMO=true bun run db:seed:turso
          TURSO_DATABASE_URL="file:/tmp/turso-ci.db" node -e "
            import('@libsql/client').then(async ({ createClient }) => {
              const client = createClient({ url: 'file:/tmp/turso-ci.db' });
              const products = await client.execute('SELECT COUNT(*) as c FROM products');
              const users = await client.execute('SELECT COUNT(*) as c FROM users');
              const coupons = await client.execute('SELECT COUNT(*) as c FROM coupons');
              console.log('turso-ci products=' + products.rows[0].c + ' users=' + users.rows[0].c + ' coupons=' + coupons.rows[0].c);
              if (products.rows[0].c < 15) throw new Error('Expected >=15 products, got ' + products.rows[0].c);
              if (users.rows[0].c < 2) throw new Error('Expected >=2 users, got ' + users.rows[0].c);
              if (coupons.rows[0].c < 3) throw new Error('Expected >=3 coupons, got ' + coupons.rows[0].c);
              console.log('Turso file-DB seed verified');
            });
          "

      - name: Build
        run: bun run build
        env:
          # Required at build time for Next.js (NEXT_PUBLIC not needed, but ensure DB exists)
          DATABASE_FILE: ./data/app.db

      - name: Verify build output
        run: |
          test -d .next || (echo "Build failed: .next not found" && exit 1)
          echo "Build succeeded, .next size: $(du -sh .next | cut -f1)"

      - name: Smoke test (boot + HTTP)
        run: |
          PORT=3100 bun run start > /tmp/next-start.log 2>&1 &
          echo $! > /tmp/next.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3100/ > /dev/null && break || sleep 2
          done
          curl -sf http://127.0.0.1:3100/ | head -c 200; echo
          curl -sf http://127.0.0.1:3100/catalog | head -c 200; echo
          curl -sf http://127.0.0.1:3100/auth/login | head -c 200; echo
          echo "Smoke test passed"
          kill $(cat /tmp/next.pid) || true

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install
      - name: Check for Vercel read-only FS regression
        run: |
          echo "Checking lib/db.ts handles Vercel /var/task/data..."
          grep -q "getEffectiveDbPath" lib/db.ts || (echo "Missing getEffectiveDbPath in lib/db.ts" && exit 1)
          grep -q "FALLBACK_SCHEMA" lib/db.ts || (echo "Missing FALLBACK_SCHEMA" && exit 1)
          grep -q "ensureSchema" lib/db.ts || (echo "Missing ensureSchema" && exit 1)
          echo "Vercel fix present"
          # Ensure scripts also patched
          for f in scripts/*.mjs; do
            echo "Checking $f..."
            grep -q "getEffectiveDbPath" "$f" || echo "WARN: $f missing Vercel patch (may be ok for non-DB scripts)"
          done
          echo "Audit done"
